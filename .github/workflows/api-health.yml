name: API Health

# Daily check that every API the plugin depends on still works, so a break
# surfaces here instead of in a user's bug report.
on:
  schedule:
    # Off-the-hour: GitHub queues scheduled jobs heavily at :00.
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "main.js"
      - "Info.json"
      - "scripts/check-apis.mjs"
      - ".github/workflows/api-health.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: api-health
  cancel-in-progress: false

jobs:
  check:
    name: Check every API the plugin depends on
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run API health check
        id: health
        env:
          # Optional: without them the run still verifies every endpoint is
          # alive and enforcing auth, but not the response shapes.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
          WYZIE_API_KEY: ${{ secrets.WYZIE_API_KEY }}
        run: node scripts/check-apis.mjs

      - name: Open an issue when something breaks
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = '🔴 API health check is failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The daily API health check failed on ${new Date().toISOString().slice(0, 10)}.`,
              '',
              `**[See which check failed and why](${runUrl})** — the run summary lists every endpoint with a pass/fail and the exact error.`,
              '',
              'Something the plugin depends on has changed: an endpoint moved, a response shape changed, or a key was revoked.',
              'This issue closes itself automatically once the check passes again.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'api-health',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still failing — [latest run](${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['api-health'],
              });
            }

      - name: Close the issue once everything passes
        if: success() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'api-health',
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ All APIs are healthy again — closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
            }
